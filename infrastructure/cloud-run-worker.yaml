apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: jobpilot-worker
spec:
  template:
    spec:
      serviceAccountName: jobpilot-worker-runtime
      containers:
        - image: REGION-docker.pkg.dev/PROJECT_ID/jobpilot/jobpilot-worker:IMAGE_TAG
          ports:
            - containerPort: 8080
          env:
            - name: APP_NAME
              value: jobpilot-worker
            - name: ENVIRONMENT
              value: production
            - name: WORKFLOW_REPOSITORY_MODE
              value: firestore
            - name: WORKFLOW_COLLECTION
              value: jobpilot-workflows